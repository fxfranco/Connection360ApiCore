name: CI SonarQube Manual
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
      inputs:
        branch:
          description: 'Selecciona la rama para ejecutar el workflow'
          required: true
          default: 'main'
          type: choice
          options:
            - main
            - develop
            - release
            - feature/InitApplication
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Clonar el repositorio
        uses: actions/checkout@v4  # Descarga tu código
        with:
            ref: ${{ inputs.branch }} # Esto asegura que se use la rama seleccionada  
      - name: 2. Configurar el SDK de .NET 
        uses: actions/setup-dotnet@v4  # Instala el entorno de .NET
        with:
          dotnet-version: '10.x'  # Puedes cambiar a tu versión específica de .NET            
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"fxfranco_Connection360ApiCore" /o:"fxfranco" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml" /d:sonar.coverage.exclusions="**Test*/**, **/Migrations/**, **/*.json"          
          dotnet build Connection360ApiCore.slnx /p:ContinuousIntegrationBuild=true
          dotnet test Connection360ApiCore.slnx --no-build /p:ContinuousIntegrationBuild=true /p:UseSourceLink=true --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*Test*]*"          
          Get-ChildItem -Path ./TestResults -Filter coverage.opencover.xml -Recurse | Copy-Item -Destination ./TestResults/coverage.opencover.xml -Force
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
