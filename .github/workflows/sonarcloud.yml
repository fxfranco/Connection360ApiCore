name: CI SonarQube Manual
on:
  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:
    inputs:
      branch:
        description: 'Selecciona la rama para ejecutar el workflow'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
          - release
          - feature/InitApplication
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'

      # Un solo checkout: rama elegida + historial completo (fetch-depth: 0).
      # Antes había dos checkouts y el segundo (sin fetch-depth) dejaba el clon superficial.
      - name: Clonar el repositorio
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Configurar el SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # CAMBIO CLAVE: el patrón ahora busca coverage.opencover.xml en CUALQUIER subcarpeta de TestResults
          # (cada proyecto de pruebas genera ./TestResults/<guid>/coverage.opencover.xml).
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"fxfranco_Connection360ApiCore" /o:"fxfranco" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**Test*/**, **/Migrations/**, **/*.json"

          dotnet build Connection360ApiCore.slnx --configuration Debug /p:DebugSymbols=true /p:DebugType=portable

          dotnet test Connection360ApiCore.slnx --configuration Debug --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*Test*]*"

          # Diagnóstico: debe listar un archivo por cada proyecto de pruebas (aprox. 27).
          # SE ELIMINÓ el Copy-Item a ./TestResults/coverage.opencover.xml: copiaba todos los reportes
          # sobre el mismo archivo y solo sobrevivía el del último proyecto (de ahí el ~13%).
          $reports = Get-ChildItem -Path ./TestResults -Filter coverage.opencover.xml -Recurse
          Write-Host "Reportes de cobertura encontrados: $($reports.Count)"
          $reports | ForEach-Object { Write-Host $_.FullName }

          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          
      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
